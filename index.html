<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Friendship Day Alvira ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#0f172a,#1e3a8a,#6d28d9,#ec4899);
background-size:400% 400%;
animation:bg 12s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:90%;
max-width:420px;
padding:35px;
border-radius:25px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.25);
text-align:center;
color:white;
box-shadow:0 0 40px rgba(255,255,255,.2);
animation:zoom 1.5s ease;
}

@keyframes zoom{
from{
opacity:0;
transform:scale(.7);
}
to{
opacity:1;
transform:scale(1);
}
}

h1{
font-size:34px;
margin-bottom:15px;
text-shadow:0 0 20px gold;
}

h2{
font-size:25px;
color:#ffd700;
margin-bottom:15px;
}

p{
line-height:1.7;
font-size:17px;
}

button{
margin-top:30px;
padding:15px 35px;
border:none;
border-radius:50px;
font-size:18px;
cursor:pointer;
background:gold;
font-weight:bold;
transition:.3s;
}

button:hover{
transform:scale(1.1);
}

#gift{
display:none;
margin-top:25px;
font-size:55px;
animation:gift 1s infinite;
}

@keyframes gift{
50%{
transform:translateY(-10px);
}
}

#message{
display:none;
margin-top:25px;
font-size:18px;
color:#fff;
}

.heart{
position:absolute;
color:#ff4d6d;
font-size:25px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
100%{
transform:translateY(-120vh);
opacity:1;
}
}

</style>
</head>

<body>

<div class="card">

<h1>Happy Friendship Day ❤️</h1>

<h2>Alvira ✨</h2>

<p>
Some people make life brighter just by being in it.
Thank you for being such a wonderful friend.
</p>

<button onclick="openGift()">
Open Surprise 🎁
</button>

<div id="gift">
🎁
</div>

<div id="message">
  <style>
button{
  margin-top:20px;
  padding:12px 25px;
  font-size:18px;
  border:none;
  border-radius:30px;
  background:#ff4d6d;
  color:white;
  cursor:pointer;
}

#msg{
  display:none;
  margin-top:20px;
  font-size:22px;
  color:#ffe66d;
}
</style>
<script>
function surprise(){
  document.getElementById("msg").style.display="block";
}
</script>
</head>

<body>
<div>
  <h1>Happy Friendship Day ❤️</h1>
  <h2>Alvira 🌸</h2>
  <p>You're an amazing friend. Wishing you endless happiness! 💖</p>

  <button onclick="surprise()">Click Me 🎁</button>

  <div id="msg">
    🌹 Thank you for being my best friend! 🌹
  </div>
</div>
</body>
</html>
