<!DOCTYPE html>
<html>
<head>
<title>Happy Friendship Day</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0f172a,#1e3a8a,#7c3aed);
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}
h1{
  font-size:40px;
  animation: glow 2s infinite alternate;
}
@keyframes glow{
  from{ text-shadow:0 0 10px #fff; }
  to{ text-shadow:0 0 30px gold; }
}
</style>
</head>
<body>
<div>
<h1>Happy Friendship Day ❤️</h1>
<h2>Alvira ✨</h2>
<p>You're an amazing friend. Wishing you endless happiness! 🌸</p>
</div>
</body>
</html>
